          <circle cx="-9.95" cy="24.02" r="3"/>
          <circle cx="-24.02" cy="9.95" r="3"/>
          <circle cx="-24.02" cy="-9.95" r="3"/>
          <circle cx="-9.95" cy="-24.02" r="3"/>
          <circle cx="9.95" cy="-24.02" r="3"/>
