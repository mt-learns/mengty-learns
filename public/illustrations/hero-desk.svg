<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="Desk scene with learning objects">
  <title>Desk scene with learning objects</title>
  <defs>
    <linearGradient id="mt-desk-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--card, #ffffff)"/>
      <stop offset="100%" stop-color="var(--muted, #f2f2f2)"/>
    </linearGradient>
    <linearGradient id="mt-desk-blue" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="var(--primary, #0F766E)"/>
    </linearGradient>
    <linearGradient id="mt-desk-amber" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mt-desk-mint" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mt-desk-lavender" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="mt-desk-soft" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g>
    <rect x="14" y="116" width="212" height="30" rx="14" fill="url(#mt-desk-surface)" stroke="var(--border, #ebebeb)" stroke-width="1.5"/>
    <path d="M 30 117.5 H 210" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>

    <g fill="#000000" fill-opacity="0.08">
      <ellipse cx="68" cy="118" rx="46" ry="4"/>
      <ellipse cx="134" cy="118" rx="26" ry="3.5"/>
      <ellipse cx="200" cy="117" rx="24" ry="3.5"/>
      <ellipse cx="168" cy="118" rx="22" ry="3"/>
    </g>

    <g filter="url(#mt-desk-soft)">
      <g transform="translate(148 44)">
        <g stroke="url(#mt-desk-blue)" stroke-width="3.8" stroke-linecap="round">
