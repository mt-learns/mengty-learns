      <circle cx="42" cy="64" r="2" fill="#f97316"/>
      <circle cx="49" cy="64" r="2" fill="#fbbf24"/>
      <circle cx="56" cy="64" r="2" fill="#10b981"/>
      <rect x="41" y="72" width="34" height="3" rx="1.5" fill="#93c5fd"/>
      <rect x="41" y="79" width="48" height="3" rx="1.5" fill="#6ee7b7"/>
      <rect x="41" y="86" width="26" height="3" rx="1.5" fill="#fde68a"/>
      <rect x="41" y="93" width="40" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.28"/>

      <path d="M 200 52 L 220 60 V 76 C 220 89 210 97 200 101 C 190 97 180 89 180 76 V 60 Z" fill="url(#mt-desk-mint)"/>
      <path d="M 191 76 L 198 83 L 211 69" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="152" y="100" width="34" height="8" rx="4" fill="url(#mt-desk-lavender)"/>
      <rect x="156" y="92" width="26" height="8" rx="4" fill="url(#mt-desk-amber)"/>
      <rect x="159" y="94.5" width="20" height="1.6" rx="0.8" fill="#ffffff" fill-opacity="0.7"/>

      <g transform="rotate(-14 70 112)">
