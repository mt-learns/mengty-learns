      <rect x="112" y="74" width="44" height="10" rx="5" fill="#fef3c7" fill-opacity="0.55"/>
      <rect x="119" y="88" width="7" height="24" rx="3.5" fill="#92400e" fill-opacity="0.3"/>
      <rect x="131" y="88" width="7" height="24" rx="3.5" fill="#92400e" fill-opacity="0.3"/>
