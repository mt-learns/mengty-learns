      <circle cx="35.18" cy="78.95" r="3.6"/>
      <circle cx="17.05" cy="60.82" r="3.6"/>
      <circle cx="17.05" cy="35.18" r="3.6"/>
      <circle cx="35.18" cy="17.05" r="3.6"/>
      <circle cx="60.82" cy="17.05" r="3.6"/>
      <circle cx="78.95" cy="35.18" r="3.6"/>
