    <circle cx="48" cy="48" r="18" fill="none" stroke="url(#mt-k8s-clay)" stroke-width="5.5"/>
    <path d="M 32.41 39 A 18 18 0 0 1 57 32.41" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <g fill="url(#mt-k8s-knob)">
