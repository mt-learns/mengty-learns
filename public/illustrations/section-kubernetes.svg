  </defs>
  <ellipse cx="48" cy="88" rx="30" ry="4" fill="#000000" fill-opacity="0.1"/>
  <rect x="6" y="6" width="84" height="84" rx="22" fill="url(#mt-k8s-tile)" stroke="var(--border, #ebebeb)" stroke-width="1.5"/>
