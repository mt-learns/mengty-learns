<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Kubernetes section icon">
  <title>Kubernetes section icon</title>
  <defs>
    <linearGradient id="mt-k8s-tile" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="var(--card, #ffffff)"/>
      <stop offset="100%" stop-color="var(--muted, #f2f2f2)"/>
    </linearGradient>
    <radialGradient id="mt-k8s-key" cx="22%" cy="18%" r="72%">
      <stop offset="0%" stop-color="var(--primary, #0F766E)" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="var(--primary, #0F766E)" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="var(--primary, #0F766E)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mt-k8s-clay" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="var(--primary, #0F766E)"/>
    </linearGradient>
    <linearGradient id="mt-k8s-knob" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="mt-k8s-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.14"/>
