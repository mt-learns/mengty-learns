name: Deploy

# Cloudflare Workers via OpenNext (docs/deploy/CLOUDFLARE-WORKERS-PLAN.md).
# RULE: every production deploy is a release (AGENTS.md section 8, RUNBOOK section 9).
#   pull_request (same repo)  -> new Worker *version* + preview URL, not live
#   push of a tag vX.Y.Z      -> checks -> production deploy (learn.limmengty.com)
#                                -> GitHub Release vX.Y.Z with generated notes
#   push to main              -> nothing here (ci.yml / quality.yml run the checks)
# The tag must match package.json "version" and point at a commit on main.
# Rollback: `pnpm exec wrangler rollback [<version-id>]` or dashboard ->
# Workers & Pages -> mengty-learns -> Deployments. See docs/deploy/RUNBOOK.md.

on:
  pull_request:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

# Production deploys never overlap and are never cancelled half-way.
# PR previews are per PR, and a newer push cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-preview-{0}', github.event.pull_request.number) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Runs `pnpm build` (next build + scripts/check-static-routes.mjs), then
      # bundles .open-next/worker.js and .open-next/assets.
      - run: pnpm exec opennextjs-cloudflare build

      # Local dry run, no account needed. Fails above 48 MiB (limit: 64 MiB).
      - run: node scripts/check-worker-size.mjs

      # Fork PRs get no secrets, so they stop after the checks above.
      - name: Upload preview version
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          pnpm exec opennextjs-cloudflare upload --preview-alias "pr-${PR_NUMBER}" --tag "${GITHUB_SHA::7}" 2>&1 | tee upload.log
          {
            echo "### Preview version (not live)"
            echo
            grep -E "Version Preview (Alias )?URL:|Worker Version ID:" upload.log | sed 's/^/- /' || echo "- No preview URL in the wrangler output; see the step log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to production
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec opennextjs-cloudflare deploy --tag "$GITHUB_REF_NAME" --message "Release $GITHUB_REF_NAME (${GITHUB_SHA::7})" 2>&1 | tee deploy.log
          {
            echo "### Production deploy $GITHUB_REF_NAME"
            echo
            grep -E "https://|Current Version ID:" deploy.log | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    # Runs only after a successful production deploy of the same tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Deployed to https://learn.limmengty.com from ${GITHUB_SHA::7}. Rollback: docs/deploy/RUNBOOK.md."
