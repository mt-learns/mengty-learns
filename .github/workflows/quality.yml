name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs `pnpm build` (next build + static-route gate), then bundles the Worker
      - run: pnpm exec opennextjs-cloudflare build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      # Lighthouse and axe run against the Worker in wrangler dev (same
      # runtime as production), not against plain files.
      - name: Lighthouse CI and axe against the Worker preview
        run: |
          pnpm exec opennextjs-cloudflare preview --port 8787 > preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -sSf http://localhost:8787/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sSf http://localhost:8787/ >/dev/null || { cat preview.log; exit 1; }

          pnpm exec lhci autorun
          node scripts/qa-axe.mjs --url http://localhost:8787
