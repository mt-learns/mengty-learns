name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Lighthouse CI
        run: pnpm exec lhci autorun

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run axe-core accessibility scan
        run: |
          pnpm exec serve out -l 4173 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node --input-type=module -e '
            import { chromium } from "playwright";
            import AxeBuilder from "@axe-core/playwright";

            const routes = ["/", "/docs/", "/docs/design/bridge/", "/review/"];
            const browser = await chromium.launch({ headless: true });
            let failed = false;

            try {
              for (const route of routes) {
                const context = await browser.newContext();
                const page = await context.newPage();
                await page.goto(`http://127.0.0.1:4173${route}`, { waitUntil: "networkidle" });
                const results = await new AxeBuilder({ page }).analyze();
                const blocking = results.violations.filter(
                  (v) => v.impact === "serious" || v.impact === "critical"
                );
                console.log(`${route}: ${results.violations.length} total violations, ${blocking.length} serious/critical`);
                for (const v of blocking) {
                  failed = true;
                  console.error(`  [${v.impact}] ${v.id}: ${v.help} (${v.nodes.length} nodes)`);
                  for (const n of v.nodes.slice(0, 3)) {
                    console.error(`    target: ${n.target.join(", ")}`);
                  }
                }
                await context.close();
              }
            } finally {
              await browser.close();
            }

            if (failed) {
              process.exit(1);
            }
          '
